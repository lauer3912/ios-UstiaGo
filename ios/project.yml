# ══════════════════════════════════════════════════════════════
# UstiaGo - Screen Time Management App
# ══════════════════════════════════════════════════════════════

name: UstiaGo
options:
  bundleIdPrefix: com.ggsheng
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

# ══════════════════════════════════════════════════════════════
# Global Build Settings
# ══════════════════════════════════════════════════════════════

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9L6N2ZF26B
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# ══════════════════════════════════════════════════════════════
# Target 1: Main App
# ══════════════════════════════════════════════════════════════

targets:
  UstiaGo:
    type: application
    platform: iOS
    sources:
      - path: UstiaGo
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: UstiaGo/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.UstiaGo
        PRODUCT_NAME: UstiaGo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: UstiaGo/UstiaGo.entitlements
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: 9L6N2ZF26B
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES
    entitlements:
      path: UstiaGo/UstiaGo.entitlements

# ══════════════════════════════════════════════════════════════
# Target 2: Unit Tests
# ══════════════════════════════════════════════════════════════

  UstiaGoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UstiaGoTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: UstiaGo
    settings:
      base:
        INFOPLIST_FILE: UstiaGoTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.UstiaGoTests
        PRODUCT_NAME: UstiaGoTests
        GENERATE_INFOPLIST_FILE: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UstiaGo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/UstiaGo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L6N2ZF26B

# ══════════════════════════════════════════════════════════════
# Target 3: UI Tests
# ══════════════════════════════════════════════════════════════

  UstiaGoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UstiaGoUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: UstiaGo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.UstiaGo.UITests
        PRODUCT_NAME: UstiaGoUITests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TEST_TARGET: "$(BUILT_PRODUCTS_DIR)/UstiaGo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/UstiaGo"
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L6N2ZF26B

# ══════════════════════════════════════════════════════════════
# Schemes
# ══════════════════════════════════════════════════════════════

schemes:
  UstiaGo:
    build:
      targets:
        UstiaGo: all
        UstiaGoTests: [test]
        UstiaGoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UstiaGoTests
        - UstiaGoUITests
    archive:
      config: Release