# ═══════════════════════════════════════════════════════════════
# Screenshots — 为 App Store 捕获多个尺寸的截图
# ═══════════════════════════════════════════════════════════════

name: Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      matrix:
        device:
          - name: "iPhone 17 Pro"
            id: "iPhone 17 Pro"
            size: "6.3"
          - name: "iPhone 17 Pro Max"
            id: "iPhone 17 Pro Max"
            size: "6.9"
          - name: "iPad Pro 13-inch"
            id: "iPad Pro 13-inch (M4)"
            size: "13"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Boot Simulator
        run: |
          echo "=== Looking for ${{ matrix.device.name }} ==="
          DEVICE_ID=""
          for UUID in $(xcrun simctl list devices available | grep "${{ matrix.device.name }}" | grep Shutdown | awk -F'(' '{print $2}' | awk -F')' '{print $1}' | head -1); do
            echo "Booting: $UUID"
            xcrun simctl boot "$UUID" && DEVICE_ID="$UUID" && break
          done

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: Could not boot ${{ matrix.device.name }}"
            exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "Booted device: $DEVICE_ID"

      - name: Run Screenshots Test
        run: |
          mkdir -p .build
          xcrun simctl booted "${{ env.DEVICE_ID }}" &

          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ matrix.device.name }}" \
            -derivedDataPath .build/DerivedData \
            test \
            -only-testing:UstiaGoUITests/GuidedTourTests \
            -resultBundlePath .build/screenshots.xcresult 2>&1 | tee .build/test.log

          echo "Test completed, extracting screenshots..."

      - name: Extract Screenshots
        run: |
          mkdir -p .build/screenshots/${{ matrix.device.name }}
          chmod +x .build/DerivedData/Logs/Test/*.xcresult 2>/dev/null || true

          # Find and copy screenshots from the test result
          if [ -d ".build/DerivedData/Logs/Test" ]; then
            find .build/DerivedData/Logs/Test -name "*.xcresult" -type d | while read result; do
              echo "Processing: $result"
              # Copy any attachments (screenshots)
              find "$result" -type f -name "*.png" 2>/dev/null | head -20
            done
          fi

          # Alternative: extract from xcresult bundle directly
          if [ -f ".build/screenshots.xcresult" ]; then
            echo "Extracting from xcresult bundle..."
            # xcresult tool can extract attachments, but may not be installed
            # Try using unzip to get attachments
            cd .build/screenshots/${{ matrix.device.name }}
            unzip -o "../../screenshots.xcresult" "attachments/" 2>/dev/null || true
            ls -la
          fi

          echo "=== Screenshot files found ==="
          find .build -name "*.png" -type f 2>/dev/null | head -20

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.device.name }}
          path: .build/**/*.png
          if-no-files-found: warn
          retention-days: 30