# ═══════════════════════════════════════════════════════════════
# TestFlight Upload — 构建 IPA 并上传到 App Store Connect
# 自动添加 support@techidaily.com 为 Internal Tester
# ═══════════════════════════════════════════════════════════════
#
# 需要在 GitHub Repo Settings > Variables 设置:
#   APPSTORE_ISSUER_ID    - App Store Connect Issuer ID
#   APPSTORE_API_KEY_ID   - App Store Connect API Key ID
#
# 需要在 GitHub Repo Settings > Secrets 设置:
#   APPSTORE_API_PRIVATE_KEY  - App Store Connect API 私钥
#   APPSTORE_CERTIFICATES_FILE_BASE64 - 签名证书 p12 base64
#   APPSTORE_CERTIFICATES_PASSWORD - 证书密码
# ═══════════════════════════════════════════════════════════════

name: TestFlight Upload

on:
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]
    branches: [main]

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios/fastlane

      - name: Install Dependencies
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install
        working-directory: ios/fastlane

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Download Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.ggsheng.UstiaGo
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Build
        uses: Apple-Actions/xcodebuild@v1
        with:
          project: ios/UstiaGo.xcodeproj
          scheme: UstiaGo
          sdk: iphoneos
          action: archive
          archive-path: .build/Archives/UstiaGo.xcarchive
          configuration: Release
          build-number: ${{ github.run_number }}
          zip-result-bundle: true
          zip-archive: true

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          bundle exec fastlane upload_testflight ipa:.build/Artifacts/UstiaGo.ipa/UstiaGo.ipa
        working-directory: ios/fastlane

      - name: Upload Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          include-hidden-files: true
          path: .build/*.log
          if-no-files-found: warn