# ═══════════════════════════════════════════════════════════════
# TestFlight Upload — 构建 IPA 并上传到 App Store Connect
# 自动添加 support@techidaily.com 为 Internal Tester
# Updated: 2026-05-14
# ═══════════════════════════════════════════════════════════════

name: TestFlight Upload

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Write Provisioning Profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/UstiaGo_App_Store.mobileprovision"

      - name: Write API Key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" | base64 -d > "$HOME/.appstoreconnect/private_keys/ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"

      - name: Build Archive
        run: |
          mkdir -p build
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=9L6N2ZF26B \
            PROVISIONING_PROFILE_SPECIFIER="UstiaGo App Store" \
            -archivePath build/UstiaGo.xcarchive \
            archive 2>&1 | tee build/archive.log
          echo "Archive exit code: ${PIPESTATUS[0]}"
          ls -la build/UstiaGo.xcarchive

      - name: Export IPA
        run: |
          cat > build/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamId</key>
            <string>9L6N2ZF26B</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ggsheng.UstiaGo</key>
              <string>UstiaGo App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcrun xcodebuild \
            -exportArchive \
            -archivePath build/UstiaGo.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build \
            2>&1 | tee build/export.log
          echo "Export exit code: ${PIPESTATUS[0]}"
          ls -la build/*.ipa 2>/dev/null || echo "No IPA"

      - name: Upload to TestFlight
        run: |
          IPA=$(ls build/*.ipa 2>/dev/null | head -1)
          echo "Uploading IPA: $IPA"
          xcrun altool \
            --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "${{ vars.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ vars.APPSTORE_ISSUER_ID }}" \
            --verbose \
            2>&1 | tee build/upload.log
          echo "Upload exit code: ${PIPESTATUS[0]}"

      - name: Upload Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: warn

      - name: Add Internal Tester
        env:
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          # Install Python dependencies for JWT and requests
          pip3 install pyjwt requests 2>/dev/null || true

          # Generate JWT token for App Store Connect API
          echo "Generating API token..."
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/ApiKey_${API_KEY_ID}.p8"

          # Create Python script to generate JWT and call API
          python3 << 'PYTHON_SCRIPT'
import jwt
import time
import requests
import os
import sys

API_KEY_ID = os.environ['API_KEY_ID']
API_ISSUER = os.environ['API_ISSUER']
API_KEY_PATH = os.path.expanduser(f"~/.appstoreconnect/private_keys/ApiKey_{API_KEY_ID}.p8")

# Read private key
with open(API_KEY_PATH, 'rb') as f:
    private_key = f.read()

# Create JWT token
token = jwt.encode(
    {
        "iss": API_ISSUER,
        "iat": int(time.time()),
        "exp": int(time.time()) + 3600,
        "aud": "appstoreconnect-v1",
        "prn": f"apiKey/{API_KEY_ID}"
    },
    private_key,
    algorithm="ES256",
    headers={"kid": API_KEY_ID}
)

print(f"JWT Token created successfully")

# API Headers
HEADERS = {
    "Authorization": f"Bearer {token}",
    "Content-Type": "application/json",
    "X-HTTP-Method-Override": "PATCH"
}

# Step 1: Get the app ID for UstiaGo
print("Getting app info...")
apps_response = requests.get(
    "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.ggsheng.UstiaGo",
    headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
)
apps_data = apps_response.json()
if not apps_data.get('data'):
    print(f"Error: Could not find app. Response: {apps_data}")
    sys.exit(1)

app_id = apps_data['data'][0]['id']
print(f"App ID: {app_id}")

# Step 2: Get or create internal beta group
print("Looking for internal beta group...")
groups_response = requests.get(
    f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaGroups",
    headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
)
groups_data = groups_response.json()

internal_group = None
for group in groups_data.get('data', []):
    if group['attributes']['isInternalGroup']:
        internal_group = group
        break

if not internal_group:
    print("Creating internal beta group...")
    create_response = requests.post(
        f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaGroups",
        headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
        json={
            "data": {
                "attributes": {
                    "name": "Internal Testers",
                    "isInternalGroup": True
                },
                "type": "betaGroups"
            }
        }
    )
    create_data = create_response.json()
    if create_response.status_code not in [200, 201]:
        print(f"Error creating group: {create_data}")
        sys.exit(1)
    internal_group = create_data['data']

group_id = internal_group['id']
print(f"Internal beta group ID: {group_id}")

# Step 3: Add tester email to the group
TESTER_EMAIL = "support@techidaily.com"
print(f"Adding {TESTER_EMAIL} to beta group...")

# Check if tester already exists
testers_response = requests.get(
    f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group_id}/betaTesters",
    headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
)
testers_data = testers_response.json()

already_exists = False
for tester in testers_data.get('data', []):
    if tester['attributes']['email'] == TESTER_EMAIL:
        already_exists = True
        print(f"Tester {TESTER_EMAIL} already exists in group")
        break

if not already_exists:
    add_response = requests.post(
        f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group_id}/betaTesters",
        headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
        json={
            "data": {
                "attributes": {"email": TESTER_EMAIL},
                "type": "betaTesters"
            }
        }
    )
    add_data = add_response.json()
    if add_response.status_code in [200, 201]:
        print(f"Successfully added {TESTER_EMAIL} to beta group")
    else:
        print(f"Error adding tester: {add_data}")
else:
    print(f"Tester {TESTER_EMAIL} already in beta group")

# Step 4: Get the latest build and link it to the group
print("Linking latest build to beta group...")
builds_response = requests.get(
    f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/builds?limit=1&sort=-uploadedDate",
    headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
)
builds_data = builds_response.json()

if builds_data.get('data'):
    build_id = builds_data['data'][0]['id']
    print(f"Latest build ID: {build_id}")

    # Link build to beta group
    link_response = requests.post(
        f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group_id}/builds",
        headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
        json={
            "data": {
                "id": build_id,
                "type": "builds"
            }
        }
    )
    if link_response.status_code in [200, 201]:
        print(f"Successfully linked build {build_id} to beta group")
    else:
        print(f"Note: Build may already be linked. Status: {link_response.status_code}")

print("\nDone! support@techidaily.com should have access to the latest TestFlight build.")
PYTHON_SCRIPT