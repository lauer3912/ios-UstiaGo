name: TestFlight Upload (Fastlane)

on:
  workflow_dispatch:

env:
  TEAM_ID: '9L6N2ZF26B'
  BUNDLE_ID: 'com.ggsheng.UstiaGo'
  SCHEME: 'UstiaGo'
  APPSTORE_KEY_ID: 'H3973L93M5'
  APPSTORE_ISSUER_ID: 'b2a00f88-3a8d-40d0-b148-1f1db92e10b7'

jobs:
  build-and-upload:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer && xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: |
          gem install fastlane --no-document
          fastlane --version

      - name: Create directories
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p fastlane
          mkdir -p build

      - name: Write Certificate
        run: |
          echo "${{ secrets.CERTIFICATE_P12 }}" | base64 --decode > "fastlane/certificate.p12"

      - name: Write Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/UstiaGo_App_Store.mobileprovision"

      - name: Write API Key
        run: |
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > "fastlane/AuthKey_${{ env.APPSTORE_KEY_ID }}.p8"

      - name: Import Certificate
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Build
        run: |
          xcodebuild archive \
            -project ios/UstiaGo.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -archivePath build/UstiaGo.xcarchive \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="UstiaGo App Store" \
            DEVELOPMENT_TEAM=${{ env.TEAM_ID }}

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/UstiaGo.xcarchive \
            -exportPath build \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload to TestFlight via Fastlane Pilot
        working-directory: ./ios
        run: |
          # Create ExportOptions.plist if not exists
          cat > ../build/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution</string>
            <key>teamId</key>
            <string>${{ env.TEAM_ID }}</string>
          </dict>
          </plist>
EOF

          # Run fastlane pilot upload
          APPSTORE_CONNECT_API_KEY_PATH="../fastlane/AuthKey_${{ env.APPSTORE_KEY_ID }}.p8" \
          fastlane pilot upload \
            --api-key-path "../fastlane/AuthKey_${{ env.APPSTORE_KEY_ID }}.p8" \
            --app-platform ios \
            --app-id "${{ env.BUNDLE_ID }}" \
            --ipa-path "../build/UstiaGo.ipa" \
            --skip-breaking-change-confirmation \
            --verbose

      - name: Upload Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UstiaGo-xcarchive
          path: build/UstiaGo.xcarchive
