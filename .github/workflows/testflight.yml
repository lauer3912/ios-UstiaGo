# ═══════════════════════════════════════════════════════════════
# TestFlight Upload — 构建 IPA 并上传到 App Store Connect
# ═══════════════════════════════════════════════════════════════

name: TestFlight Upload

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TEAM_ID: 9L6N2ZF26B
  BUNDLE_ID: com.ggsheng.UstiaGo
  SCHEME: UstiaGo
  APPSTORE_KEY_ID: H3973L93M5
  APPSTORE_ISSUER_ID: b2a00f88-3a8d-40d0-b148-1f1db92e10b7
  APPSTORE_API_KEY_CONTENT: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
  XCODE_APP: /Applications/Xcode_16.2.app

jobs:
  build-and-upload:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "${{ env.XCODE_APP }}" ]; then
            sudo xcode-select -s "${{ env.XCODE_APP }}/Contents/Developer"
          fi
          xcodebuild -version

      - name: Create Directories
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p build

      # ── Signing Material ───────────────────────────────────
      - name: Write Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/UstiaGo_App_Store.mobileprovision"

      - name: Import Code-Signing Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      # ── Build ──────────────────────────────────────────────
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project ios/UstiaGo.xcodeproj \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -archivePath build/UstiaGo.xcarchive \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="UstiaGo App Store" \
            DEVELOPMENT_TEAM="${{ env.TEAM_ID }}" 2>&1 | tee build/build.log

      - name: Copy ExportOptions.plist
        run: cp ios/ExportOptions.plist build/ExportOptions.plist

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/UstiaGo.xcarchive \
            -exportPath build \
            -exportOptionsPlist build/ExportOptions.plist 2>&1 | tee build/export.log

      - name: List Build Output
        run: ls -lh build/UstiaGo.ipa

      # ── Upload ─────────────────────────────────────────────
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/UstiaGo.ipa
          issuer-id: ${{ env.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ env.APPSTORE_KEY_ID }}
          api-private-key: ${{ env.APPSTORE_API_KEY_CONTENT }}
          wait-for-processing: true
