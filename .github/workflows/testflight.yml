# ═══════════════════════════════════════════════════════════════
# TestFlight Upload — 构建 IPA 并上传到 App Store Connect
# 自动添加 support@techidaily.com 为 Internal Tester
# ═══════════════════════════════════════════════════════════════

name: TestFlight Upload

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Write Provisioning Profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/UstiaGo_App_Store.mobileprovision"
          echo "Provisioning profile written"

      - name: Write API Key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" | base64 -d \
            > "$HOME/.appstoreconnect/private_keys/ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/ApiKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"
          echo "API key written to ~/.appstoreconnect/private_keys/"

      - name: Build
        run: |
          mkdir -p build
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=9L6N2ZF26B \
            PROVISIONING_PROFILE_SPECIFIER="UstiaGo App Store" \
            -archivePath build/UstiaGo.xcarchive \
            archive 2>&1 | tee build/build.log
          echo "Archive exit code: ${PIPESTATUS[0]}"

      - name: Export IPA
        run: |
          mkdir -p build
          ARCHIVE=$(xcodebuild -showBuildSettings -xml -json 2>/dev/null | jq -r '.[] | if .archivePath then .archivePath else empty end' | head -1)
          echo "Archive path: $ARCHIVE"
          # Find the actual archive
          ARCHIVE=$(find ~/Library/Developer/Xcode/DerivedData -name "UstiaGo.xcarchive" -type d 2>/dev/null | head -1)
          echo "Found archive: $ARCHIVE"
          ls -la "$ARCHIVE" 2>/dev/null || echo "Archive not found"
          cat > build/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          xcrun xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath build \
            -exportOptionsPlist build/ExportOptions.plist \
            2>&1 | tee build/export.log
          echo "Export exit code: ${PIPESTATUS[0]}"
          ls -la build/*.ipa 2>/dev/null || echo "No IPA found"

      - name: Upload to TestFlight
        run: |
          IPA=$(find build -name "*.ipa" | head -1)
          echo "Uploading: $IPA"
          xcrun altool \
            --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "${{ vars.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ vars.APPSTORE_ISSUER_ID }}" \
            --verbose \
            2>&1 | tee build/upload.log
          echo "Upload exit code: ${PIPESTATUS[0]}"

      - name: Upload Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          include-hidden-files: true
          path: build/*.log
          if-no-files-found: warn