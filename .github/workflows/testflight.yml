name: TestFlight Upload

on:
  workflow_dispatch:

env:
  TEAM_ID: '9L6N2ZF26B'
  BUNDLE_ID: 'com.ggsheng.UstiaGo'
  SCHEME: 'UstiaGo'
  APPSTORE_KEY_ID: 'H3973L93M5'
  APPSTORE_ISSUER_ID: 'b2a00f88-3a8d-40d0-b148-1f1db92e10b7'

jobs:
  build-and-upload:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.app
          xcodebuild -version

      - name: Create Keychain and Profiles Directory
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning Profiles
          mkdir -p ~/.appstoreconnect/private_keys

      - name: Write Certificate to File
        run: |
          echo "${{ secrets.CERTIFICATE_P12 }}" | base64 --decode > ios/certs/certificate.p12

      - name: Write Provisioning Profile to File
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > ~/Library/MobileDevice/Provisioning Profiles/UstiaGo_App_Store.mobileprovision

      - name: Write API Key to File
        run: |
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/ApiKey_${{ env.APPSTORE_KEY_ID }}.p8

      - name: Import Certificate into Keychain
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Build for TestFlight
        run: |
          xcodebuild -scheme $SCHEME \
            -workspace ios/UstiaGo.xcodeproj/project.xcworkspace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/UstiaGo.xcarchive \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build
        env:
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGNING_ALLOWED: "YES"

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app -f build/UstiaGo.xcarchive -t ios \
            --apiKey ${{ env.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ env.APPSTORE_ISSUER_ID }} \
            --apiKeyId ${{ env.APPSTORE_KEY_ID }} \
            --asc-provider ${{ env.TEAM_ID }}

      - name: Upload Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UstiaGo-xcarchive
          path: build/UstiaGo.xcarchive
