name: TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number override (optional)'
        required: false
        type: string

env:
  TEAM_ID: '9L6N2ZF26B'
  BUNDLE_ID: 'com.ggsheng.UstiaGo'
  SCHEME: 'UstiaGo'

jobs:
  build-and-upload:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.app
          xcodebuild -version

      - name: Download Provisioning Profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Import Certificate into Keychain
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Build for TestFlight
        run: |
          xcodebuild -scheme $SCHEME \
            -workspace ios/UstiaGo.xcodeproj/project.xcworkspace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/UstiaGo.xcarchive \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build
        env:
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGNING_ALLOWED: "YES"

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app -f build/UstiaGo.xcarchive -t ios \
            --username '${{ secrets.APP_STORE_CONNECT_USERNAME }}' \
            --password '${{ secrets.APP_STORE_CONNECT_PASSWORD }}' \
            --asc-provider ${{ env.TEAM_ID }}

      - name: Build Summary
        if: success()
        run: echo "TestFlight upload completed successfully!"

      - name: Upload Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UstiaGo-xcarchive
          path: build/UstiaGo.xcarchive
