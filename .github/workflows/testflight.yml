name: TestFlight Upload (Fastlane)

on:
  workflow_dispatch:

env:
  TEAM_ID: 9L6N2ZF26B
  BUNDLE_ID: com.ggsheng.UstiaGo
  SCHEME: UstiaGo
  APPSTORE_KEY_ID: H3973L93M5
  APPSTORE_ISSUER_ID: b2a00f88-3a8d-40d0-b148-1f1db92e10b7

jobs:
  build-and-upload:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Create directories
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p fastlane
          mkdir -p build

      - name: Write Certificate
        run: |
          echo "${{ secrets.CERTIFICATE_P12 }}" | base64 --decode > "fastlane/certificate.p12"

      - name: Write Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/UstiaGo_App_Store.mobileprovision"

      - name: Write API Key
        run: |
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > "fastlane/AuthKey_${{ env.APPSTORE_KEY_ID }}.p8"

      - name: Import Certificate
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Build
        run: |
          xcodebuild archive \
            -project ios/UstiaGo.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -archivePath build/UstiaGo.xcarchive \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="UstiaGo App Store" \
            DEVELOPMENT_TEAM=${{ env.TEAM_ID }} 2>&1 | tee build/build.log

      - name: Create ExportOptions
        run: |
          mkdir -p build
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>signingCertificate</key>\n  <string>iPhone Distribution</string>\n  <key>teamId</key>\n  <string>%s</string>\n</dict>\n</plist>\n' "9L6N2ZF26B" > build/ExportOptions.plist

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/UstiaGo.xcarchive \
            -exportPath build \
            -exportOptionsPlist build/ExportOptions.plist 2>&1 | tee build/export.log

      - name: Upload to TestFlight via Fastlane Pilot
        run: |
          cd ios
          fastlane pilot upload \
            --api-key-path "../fastlane/AuthKey_${{ env.APPSTORE_KEY_ID }}.p8" \
            --app-platform ios \
            --app-identifier "${{ env.BUNDLE_ID }}" \
            --ipa "../build/UstiaGo.ipa" 2>&1 | tee ../build/fastlane.log

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 1
