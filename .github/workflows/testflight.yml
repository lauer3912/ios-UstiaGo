# ═══════════════════════════════════════════════════════════════
# TestFlight Upload — 构建 IPA 并上传到 App Store Connect
# 自动添加 support@techidaily.com 为 Internal Tester
# ═══════════════════════════════════════════════════════════════

name: TestFlight Upload

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Write Provisioning Profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/UstiaGo_App_Store.mobileprovision"
          echo "Provisioning profile written"

      - name: Build
        run: |
          mkdir -p build
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=9L6N2ZF26B \
            PROVISIONING_PROFILE_SPECIFIER="UstiaGo App Store" \
            -archivePath build/UstiaGo.xcarchive \
            archive 2>&1 | tee build/build.log
          echo "Archive exit code: ${PIPESTATUS[0]}"

      - name: Upload to TestFlight
        run: |
          # Add API key to keychain
          KEYCHAIN_PATH="$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$HOME/Library/Keychains"

          # Write the API key to a temp file
          echo "$APPSTORE_API_PRIVATE_KEY" | base64 -d > /tmp/authkey.p8

          # Import to keychain with a label matching the key ID
          security import /tmp/authkey.p8 -k "$KEYCHAIN_PATH" -P "" -A -T /usr/bin/codesign -T /usr/bin/security -T /Applications/Xcode.app -A
          security set-key-partition-list -S -k "" "$KEYCHAIN_PATH"

          # Upload using altool with API key
          xcrun altool \
            --upload-app \
            -f build/UstiaGo.xcarchive \
            -t ios \
            --apiKey "${{ vars.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ vars.APPSTORE_ISSUER_ID }}" \
            --verbose \
            2>&1 | tee build/upload.log

        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Upload Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          include-hidden-files: true
          path: build/*.log
          if-no-files-found: warn