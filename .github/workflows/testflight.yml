# ═══════════════════════════════════════════════════════════════
# TestFlight Upload — 构建 IPA 并上传到 App Store Connect
# 自动添加 support@techidaily.com 为 Internal Tester
# ═══════════════════════════════════════════════════════════════
#
# 需要在 GitHub Repo Settings > Variables 设置:
#   APPSTORE_ISSUER_ID    - App Store Connect Issuer ID
#   APPSTORE_API_KEY_ID   - App Store Connect API Key ID
#
# 需要在 GitHub Repo Settings > Secrets 设置:
#   APPSTORE_API_PRIVATE_KEY  - App Store Connect API 私钥
#   CERTIFICATE_P12           - 签名证书 p12 base64
#   CERTIFICATE_PASSWORD      - 证书密码
# ═══════════════════════════════════════════════════════════════

name: TestFlight Upload

on:
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]
    branches: [main]

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios/fastlane

      - name: Install Dependencies
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install
        working-directory: ios/fastlane

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Build
        run: |
          mkdir -p .build
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=9L6N2ZF26B \
            -archivePath .build/UstiaGo.xcarchive \
            archive 2>&1 | tee .build/build.log
          echo "Archive exit code: ${PIPESTATUS[0]}"

      - name: Export IPA
        run: |
          xcrun xcodebuild \
            -exportArchive \
            -archivePath .build/UstiaGo.xcarchive \
            -exportPath .build \
            -exportOptionsPlist /dev/null \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID ${{ vars.APPSTORE_ISSUER_ID }} \
            -authenticationKeyID ${{ vars.APPSTORE_API_KEY_ID }} \
            -authenticationKeyContent "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" \
            2>&1 | tee -a .build/build.log
          echo "Export exit code: ${PIPESTATUS[0]}"
          ls -la .build/*.ipa 2>/dev/null || echo "No IPA found"

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          bundle exec fastlane upload_testflight ipa:.build/UstiaGo.ipa
        working-directory: ios/fastlane

      - name: Upload Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          include-hidden-files: true
          path: .build/*.log
          if-no-files-found: warn