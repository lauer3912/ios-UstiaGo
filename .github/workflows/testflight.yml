name: TestFlight Upload

on:
  workflow_dispatch:

env:
  TEAM_ID: '9L6N2ZF26B'
  BUNDLE_ID: 'com.ggsheng.UstiaGo'
  SCHEME: 'UstiaGo'
  APPSTORE_KEY_ID: 'H3973L93M5'
  APPSTORE_ISSUER_ID: 'b2a00f88-3a8d-40d0-b148-1f1db92e10b7'

jobs:
  build-and-upload:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer && xcodebuild -version

      - name: Create directories
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          mkdir -p build

      - name: Write Certificate
        run: |
          echo "${{ secrets.CERTIFICATE_P12 }}" | base64 --decode > "build/certificate.p12"

      - name: Write Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/UstiaGo_App_Store.mobileprovision"

      - name: Write API Key
        run: |
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > "$HOME/.appstoreconnect/private_keys/ApiKey_${{ env.APPSTORE_KEY_ID }}.p8"

      - name: Import Certificate
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Build
        run: |
          xcodebuild archive \
            -project ios/UstiaGo.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -archivePath build/UstiaGo.xcarchive \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="UstiaGo App Store" \
            DEVELOPMENT_TEAM=${{ env.TEAM_ID }}

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app -f build/UstiaGo.xcarchive -t ios \
            --apiKey ${{ env.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ env.APPSTORE_ISSUER_ID }} \
            --apiKeyId ${{ env.APPSTORE_KEY_ID }} \
            --asc-provider ${{ env.TEAM_ID }} \
            2>&1 | tee upload.log
          echo "=== ALTOOL EXIT CODE: $? ===" >> upload.log
          cat upload.log

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-log
          path: upload.log

      - name: Upload Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UstiaGo-xcarchive
          path: build/UstiaGo.xcarchive
