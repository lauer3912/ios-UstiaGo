# ═══════════════════════════════════════════════════════════════
# Record Screen — 录制引导操作视频 (60秒+)
# ═══════════════════════════════════════════════════════════════

name: Record Screen

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Boot Simulator
        run: |
          echo "=== Checking booted devices ==="
          xcrun simctl list devices booted
          echo ""
          echo "=== Looking for iPhone 17 Pro ==="
          # First try to boot an iPhone 17 Pro
          DEVICE_ID=""
          for UUID in $(xcrun simctl list devices available | grep "iPhone 17" | grep Shutdown | awk -F'(' '{print $2}' | awk -F')' '{print $1}' | head -1); do
            echo "Booting device: $UUID"
            xcrun simctl boot "$UUID" 2>/dev/null && DEVICE_ID="$UUID" && break
            echo "Failed to boot $UUID, trying next..."
          done

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: Could not boot any iPhone 17 device"
            exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "Booted device: $DEVICE_ID"

      - name: Start Recording
        run: |
          mkdir -p .build
          RECORDING_PATH="$PWD/.build/screen-recording.mp4"
          echo "Starting recording to: $RECORDING_PATH"
          # Boot simulator and wait for it to be fully initialized
          echo "Booting simulator and waiting for display initialization..."
          xcrun simctl boot "${{ env.DEVICE_ID }}"
          sleep 8
          # Start the app first to initialize the display rendering
          echo "Launching UstiaGo app to initialize display..."
          xcrun simctl launch "${{ env.DEVICE_ID }}" com.ggsheng.UstiaGo
          sleep 3
          # Now start recording - the display should be actively rendering
          nohup xcrun simctl io "${{ env.DEVICE_ID }}" recordVideo \
            --codec=h264 \
            --mask=black \
            --force \
            "$RECORDING_PATH" > .build/recording.log 2>&1 &
          echo "Recording started"
          # Wait for recording to start and file to appear
          for i in {1..10}; do
            if [ -f "$RECORDING_PATH" ] && [ -s "$RECORDING_PATH" ]; then
              echo "Video file active: $(ls -lh "$RECORDING_PATH")"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Build & Run Guided Tour Test
        run: |
          set -o pipefail
          mkdir -p .build
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -derivedDataPath .build/DerivedData \
            test \
            -only-testing:UstiaGoUITests/GuidedTourTests 2>&1 | tee .build/guided-tour.log
          TEST_RESULT=${PIPESTATUS[0]}
          echo "Test exit code: $TEST_RESULT"
          if [ $TEST_RESULT -ne 0 ]; then
            echo "Test may have had issues, checking log..."
          fi

      - name: Stop Recording
        run: |
          echo "Stopping screen recording..."
          echo "Current working directory: $PWD"
          # Find and kill the recordVideo process with SIGINT to properly finalize
          RECORD_PID=$(pgrep -f "recordVideo")
          if [ -n "$RECORD_PID" ]; then
            echo "Sending SIGINT to recording process: $RECORD_PID"
            kill -INT $RECORD_PID 2>/dev/null
            echo "Waiting for recording to finalize..."
            sleep 5
          else
            echo "No recordVideo process found"
          fi
          echo "=== Checking for video file ==="
          ls -la .build/ 2>/dev/null || echo ".build directory does not exist"
          echo "=== Looking for mp4 files ==="
          find . -name "*.mp4" -type f 2>/dev/null | head -10
          echo "=== Final check ==="
          if [ -f ".build/screen-recording.mp4" ]; then
            echo "Video file found: $(ls -lh .build/screen-recording.mp4)"
          else
            echo "Video file not found"
            echo "Recording log contents:"
            cat .build/recording.log 2>/dev/null | head -30
          fi

      - name: Upload Video
        uses: actions/upload-artifact@v7
        with:
          name: guided-tour-recording
          path: .build/screen-recording.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: guided-tour-logs
          path: .build/guided-tour.log
          if-no-files-found: warn