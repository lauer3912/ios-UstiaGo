# ═══════════════════════════════════════════════════════════════
# Record Screen — 录制引导操作视频 (60秒+)
# ═══════════════════════════════════════════════════════════════

name: Record Screen

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Boot Simulator
        run: |
          echo "=== Checking booted devices ==="
          xcrun simctl list devices booted
          echo ""
          echo "=== Looking for iPhone 17 Pro ==="
          DEVICE_ID=""
          for UUID in $(xcrun simctl list devices available | grep "iPhone 17" | grep Shutdown | awk -F'(' '{print $2}' | awk -F')' '{print $1}' | head -1); do
            echo "Booting device: $UUID"
            xcrun simctl boot "$UUID" 2>/dev/null && DEVICE_ID="$UUID" && break
            echo "Failed to boot $UUID, trying next..."
          done

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: Could not boot any iPhone 17 device"
            exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "Booted device: $DEVICE_ID"

      - name: Build & Run Guided Tour Test
        run: |
          set -o pipefail
          mkdir -p .build

          # Use the device ID from previous step
          DEVICE_ID="${{ env.DEVICE_ID }}"
          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: DEVICE_ID not set from previous step"
            exit 1
          fi
          echo "Using device: $DEVICE_ID"
          RECORDING_PATH="$PWD/.build/screen-recording.mp4"

          # Kill any existing recordVideo processes
          pkill -f "recordVideo" 2>/dev/null || true
          sleep 1

          # First enumerate to see what displays are available
          echo "Enumerating available IO ports..."
          xcrun simctl io "$DEVICE_ID" enumerate --poll 2>&1 | head -20

          # Run the test (this installs and launches the app)
          echo "Starting UI test..."
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath .build/DerivedData \
            test \
            -only-testing:UstiaGoUITests/GuidedTourTests 2>&1 | tee .build/guided-tour.log
          TEST_RESULT=${PIPESTATUS[0]}
          echo "Test exit code: $TEST_RESULT"

          # Now try to record AFTER the test has launched the app
          echo "Starting recording after app is running..."
          nohup xcrun simctl io "$DEVICE_ID" recordVideo \
            --codec=h264 \
            --mask=black \
            --force \
            "$RECORDING_PATH" &

          sleep 5

          # Check if recording file was created
          if [ -f "$RECORDING_PATH" ] && [ -s "$RECORDING_PATH" ]; then
            echo "Recording created: $(ls -lh "$RECORDING_PATH")"
          else
            echo "Note: Recording file was not created (this may be expected in headless CI)"
          fi

          # Stop recording if still running
          pkill -f "recordVideo" 2>/dev/null || true

          # Upload the video if it exists, otherwise skip
          if [ -f "$RECORDING_PATH" ] && [ -s "$RECORDING_PATH" ]; then
            echo "Uploading recording..."
          else
            echo "No recording to upload"
          fi

      - name: Upload Video
        uses: actions/upload-artifact@v7
        with:
          name: guided-tour-recording
          path: .build/screen-recording.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: guided-tour-logs
          path: .build/guided-tour.log
          if-no-files-found: warn