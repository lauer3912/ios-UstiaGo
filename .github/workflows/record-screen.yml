# ═══════════════════════════════════════════════════════════════
# Record Screen — 录制引导操作视频 (60秒+)
# ═══════════════════════════════════════════════════════════════

name: Record Screen

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Boot Simulator
        run: |
          echo "=== Checking booted devices ==="
          xcrun simctl list devices booted
          echo ""
          echo "=== Looking for iPhone 17 Pro ==="
          # First try to boot an iPhone 17 Pro
          DEVICE_ID=""
          for UUID in $(xcrun simctl list devices available | grep "iPhone 17" | grep Shutdown | awk -F'(' '{print $2}' | awk -F')' '{print $1}' | head -1); do
            echo "Booting device: $UUID"
            xcrun simctl boot "$UUID" 2>/dev/null && DEVICE_ID="$UUID" && break
            echo "Failed to boot $UUID, trying next..."
          done

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: Could not boot any iPhone 17 device"
            exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "Booted device: $DEVICE_ID"

      - name: Start Recording
        run: |
          xcrun simctl io "${{ env.DEVICE_ID }}" recordVideo \
            --codec h264 \
            --mask simulator \
            .build/screen-recording.mp4 &
          echo "Recording started, waiting for startup..."
          sleep 3

      - name: Build & Run Guided Tour Test
        run: |
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -derivedDataPath .build/DerivedData \
            test \
            -only-testing:UstiaGoUITests/GuidedTourTests 2>&1 | tee .build/guided-tour.log

      - name: Stop Recording
        run: |
          sleep 2
          kill %1 2>/dev/null || true
          sleep 2
          ls -lh .build/screen-recording.mp4 2>/dev/null || echo "Video file check"

      - name: Upload Video
        uses: actions/upload-artifact@v7
        with:
          name: guided-tour-recording
          path: .build/screen-recording.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: guided-tour-logs
          path: .build/guided-tour.log
          if-no-files-found: warn