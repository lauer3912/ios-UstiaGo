name: TestFlight Upload (Python Direct API)

on:
  workflow_dispatch:

env:
  TEAM_ID: 9L6N2ZF26B
  BUNDLE_ID: com.ggsheng.UstiaGo
  SCHEME: UstiaGo
  APPSTORE_KEY_ID: H3973L93M5
  APPSTORE_ISSUER_ID: b2a00f88-3a8d-40d0-b148-1f1db92e10b7
  APPSTORE_API_KEY_CONTENT: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

jobs:
  build-and-upload:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
          xcodebuild -version

      - name: Create directories
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p build

      - name: Write Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/UstiaGo_App_Store.mobileprovision"

      - name: Import Certificate
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Build
        run: |
          xcodebuild archive \
            -project ios/UstiaGo.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            -archivePath build/UstiaGo.xcarchive \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="UstiaGo App Store" \
            DEVELOPMENT_TEAM=${{ env.TEAM_ID }} 2>&1 | tee build/build.log

      - name: Create ExportOptions
        run: |
          mkdir -p build
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>signingCertificate</key>\n  <string>iPhone Distribution</string>\n  <key>teamId</key>\n  <string>9L6N2ZF26B</string>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>com.ggsheng.UstiaGo</key>\n    <string>UstiaGo App Store</string>\n  </dict>\n</dict>\n</plist>\n' > build/ExportOptions.plist

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/UstiaGo.xcarchive \
            -exportPath build \
            -exportOptionsPlist build/ExportOptions.plist 2>&1 | tee build/export.log

      - name: List Build Output
        run: |
          ls -la build/

      - name: Install Python & Dependencies
        run: |
          pip3 install pyjwt cryptography requests --quiet

      - name: Test API Auth & Upload
        run: |
          python3 - <<'PYEOF'
import jwt
import requests
import time
import os

key_id = os.environ['APPSTORE_KEY_ID']
issuer_id = os.environ['APPSTORE_ISSUER_ID']
key_content = os.environ.get('APPSTORE_API_KEY_CONTENT', '')
bundle_id = 'com.ggsheng.UstiaGo'

print(f"Key length: {len(key_content)}")
print(f"Key first 60 chars: {key_content[:60]}")

# Create JWT with ES256
payload = {
    'iss': issuer_id,
    'exp': int(time.time()) + 600,
    'aud': 'appstoreconnect-v1'
}
token = jwt.encode(payload, key_content, algorithm='ES256')
print(f"JWT created: {token[:50]}...")

headers = {
    'Authorization': f'Bearer {token}',
    'Content-Type': 'application/json'
}

# First test: list apps
resp = requests.get(
    f'https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]={bundle_id}',
    headers=headers,
    timeout=30
)
print(f"App lookup: {resp.status_code}")
if resp.status_code == 200:
    data = resp.json()
    apps = data.get('data', [])
    if apps:
        app_id = apps[0]['id']
        print(f"Found app_id: {app_id}")

        # Create upload session
        ipa_path = 'build/UstiaGo.ipa'
        file_size = os.path.getsize(ipa_path)

        upload_resp = requests.post(
            'https://api.appstoreconnect.apple.com/v1/uploads',
            headers=headers,
            json={
                'uploadType': 'APP',
                'assetType': 'APP',
                'app': {'id': app_id},
                'content': {'fileName': 'UstiaGo.ipa', 'size': file_size}
            },
            timeout=30
        )
        print(f"Upload init: {upload_resp.status_code}")
        print(f"Response: {upload_resp.text[:500] if upload_resp.text else 'empty'}")
    else:
        print("No app found")
else:
    print(f"Auth failed: {resp.status_code}")
    print(f"Response: {resp.text[:500]}")
PYEOF

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 7