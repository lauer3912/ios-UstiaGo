# ═══════════════════════════════════════════════════════════════
# Build & Test — push/PR 到 main 时编译并运行单元测试和 UI 测试
# ═══════════════════════════════════════════════════════════════

name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Build & Test
        uses: Apple-Actions/xcodebuild@v1
        with:
          project: ios/UstiaGo.xcodeproj
          scheme: UstiaGo
          sdk: iphonesimulator
          configuration: Debug
          build-number: ${{ github.run_number }}
          action: test
          destination: "platform=iOS Simulator,name=iPhone 17 Pro"
          result-bundle-path: .build/Artifacts/UstiaGo.xcresult
          zip-result-bundle: true

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/Artifacts/UstiaGo.xcresult
          if-no-files-found: error