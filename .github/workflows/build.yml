# ═══════════════════════════════════════════════════════════════
# Build & Test — push/PR 到 main 时编译并运行单元测试和 UI 测试
# ═══════════════════════════════════════════════════════════════

name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Build & Test
        run: |
          mkdir -p .build
          set +e
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build test 2>&1 | tee .build/build.log
          RESULT=${PIPESTATUS[0]}
          echo "Exit code: $RESULT"

          if [ $RESULT -ne 0 ]; then
            echo "Build or test failed"
            exit 1
          fi
          echo "Build and test succeeded"

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/DerivedData
          if-no-files-found: error

  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    needs: build-and-test
    strategy:
      matrix:
        device:
          - name: "iPhone 17 Pro"
          - name: "iPad Pro 13-inch (M4)"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Boot Simulator
        run: |
          DEVICE_ID=""
          for UUID in $(xcrun simctl list devices available | grep "${{ matrix.device.name }}" | grep Shutdown | awk -F'(' '{print $2}' | awk -F')' '{print $1}' | head -1); do
            echo "Booting: $UUID"
            xcrun simctl boot "$UUID" && DEVICE_ID="$UUID" && break
          done

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: Could not boot ${{ matrix.device.name }}"
            exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Run Guided Tour Test for Screenshots
        run: |
          mkdir -p .build
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ matrix.device.name }}" \
            -derivedDataPath .build/DerivedData \
            test \
            -only-testing:UstiaGoUITests/GuidedTourTests \
            -resultBundlePath .build/screenshots.xcresult 2>&1 | tee .build/screenshots.log
          echo "Test completed"

      - name: Extract Screenshots from Test Results
        run: |
          mkdir -p .build/screenshots/${{ matrix.device.name }}
          chmod +x .build/DerivedData/Logs/Test/*.xcresult 2>/dev/null || true

          # Extract screenshots from xcresult bundle
          # The xcresult is a directory bundle, screenshots are stored in Attachments
          if [ -d ".build/DerivedData/Logs/Test" ]; then
            find .build/DerivedData/Logs/Test -name "*.xcresult" -type d | while read result; do
              ATTACHMENTS_DIR="$result/Attachments"
              if [ -d "$ATTACHMENTS_DIR" ]; then
                cp "$ATTACHMENTS_DIR"/*.png ".build/screenshots/${{ matrix.device.name }}/" 2>/dev/null || true
                ls -la "$ATTACHMENTS_DIR/" 2>/dev/null || true
              fi
            done
          fi

          # Also check in the xcresult bundle directly
          if [ -d ".build/screenshots.xcresult/Attachments" ]; then
            cp .build/screenshots.xcresult/Attachments/*.png ".build/screenshots/${{ matrix.device.name }}/" 2>/dev/null || true
          fi

          echo "=== Screenshots found ==="
          find .build -name "*.png" -type f 2>/dev/null
          ls -la .build/screenshots/${{ matrix.device.name }}/ 2>/dev/null || echo "No screenshots found"

      - name: Upload Screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ matrix.device.name }}
          path: .build/screenshots/${{ matrix.device.name }}/*.png
          if-no-files-found: warn
          retention-days: 30