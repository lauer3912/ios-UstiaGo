# ═══════════════════════════════════════════════════════════════
# Build & Test — push/PR 到 main 时编译并运行单元测试和 UI 测试
# ═══════════════════════════════════════════════════════════════

name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Build & Test
        run: |
          mkdir -p .build
          set +e
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build test 2>&1 | tee .build/build.log
          RESULT=${PIPESTATUS[0]}
          echo "Exit code: $RESULT"

          if [ $RESULT -ne 0 ]; then
            echo "Build or test failed"
            exit 1
          fi
          echo "Build and test succeeded"

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/DerivedData
          if-no-files-found: error

      - name: Extract Screenshots
        run: |
          mkdir -p .build/screenshots
          # Find screenshots from test attachments
          find .build/DerivedData -name "Attachments" -type d 2>/dev/null | while read dir; do
            if [ -d "$dir" ]; then
              cp "$dir"/*.png .build/screenshots/ 2>/dev/null || true
              cp "$dir"/*.jpg .build/screenshots/ 2>/dev/null || true
            fi
          done
          echo "=== Screenshots found ==="
          ls -la .build/screenshots/ 2>/dev/null || echo "No screenshots found"
          find .build/screenshots -type f 2>/dev/null

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: .build/screenshots
          if-no-files-found: warn
          retention-days: 7

  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Find available devices
        run: |
          echo "Available iPhone devices:"
          xcrun simctl list devices available | grep "iPhone" | head -5
          echo ""
          echo "Available iPad devices:"
          xcrun simctl list devices available | grep "iPad" | head -5

      - name: Boot iPhone Simulator
        run: |
          # Find latest iPhone
          IPHONE_INFO=$(xcrun simctl list devices available | grep "iPhone" | grep Shutdown | head -1)
          echo "Found iPhone: $IPHONE_INFO"
          IPHONE_UUID=$(echo "$IPHONE_INFO" | awk -F'(' '{print $2}' | awk -F')' '{print $1}')
          IPHONE_NAME=$(echo "$IPHONE_INFO" | sed 's/(.*//' | xargs)
          echo "Booting iPhone: $IPHONE_NAME (UUID: $IPHONE_UUID)"
          xcrun simctl boot "$IPHONE_UUID"
          echo "iPhone_NAME=$IPHONE_NAME" >> $GITHUB_ENV
          echo "iPhone_UUID=$IPHONE_UUID" >> $GITHUB_ENV

      - name: Boot iPad Simulator
        run: |
          # Find latest iPad
          IPAD_INFO=$(xcrun simctl list devices available | grep "iPad" | grep Shutdown | head -1)
          echo "Found iPad: $IPAD_INFO"
          # Use Python to properly parse the device info
          IPAD_PARSED=$(python3 -c "
import sys
info = '$IPAD_INFO'.strip()
# Find UUID - it's the second parenthesized item
import re
uuid_match = re.search(r'\(([A-F0-9-]{36})\)', info)
uuid = uuid_match.group(1) if uuid_match else ''
# Find name - everything before the first (
name_match = re.match(r'([^)]+)', info)
name = name_match.group(1).strip() if name_match else ''
print(f'{name}|{uuid}')
")
          IPAD_NAME=$(echo "$IPAD_PARSED" | cut -d'|' -f1)
          IPAD_UUID=$(echo "$IPAD_PARSED" | cut -d'|' -f2)
          echo "Booting iPad: $IPAD_NAME (UUID: $IPAD_UUID)"
          xcrun simctl boot "$IPAD_UUID"
          echo "iPad_NAME=$IPAD_NAME" >> $GITHUB_ENV
          echo "iPad_UUID=$IPAD_UUID" >> $GITHUB_ENV

      - name: Run Screenshot Tests
        run: |
          mkdir -p .build
          # Run screenshot tests for both devices
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ env.iPhone_NAME }}" \
            -derivedDataPath .build/DerivedData_iPhone \
            test \
            -only-testing:UstiaGoUITests/ScreenshotTests \
            -resultBundlePath .build/screenshots_iPhone.xcresult 2>&1 | tee .build/screenshots_iphone.log

          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ env.iPad_NAME }}" \
            -derivedDataPath .build/DerivedData_iPad \
            test \
            -only-testing:UstiaGoUITests/ScreenshotTests \
            -resultBundlePath .build/screenshots_iPad.xcresult 2>&1 | tee .build/screenshots_ipad.log

          echo "Tests completed"

      - name: Extract Screenshots
        run: |
          mkdir -p .build/screenshots/iPhone .build/screenshots/iPad

          # Extract iPhone screenshots
          if [ -d ".build/screenshots_iPhone.xcresult/Attachments" ]; then
            cp .build/screenshots_iPhone.xcresult/Attachments/*.png .build/screenshots/iPhone/ 2>/dev/null || true
          fi
          find .build -path "*DerivedData_iPhone*" -name "Attachments" -type d 2>/dev/null | while read dir; do
            cp "$dir"/*.png .build/screenshots/iPhone/ 2>/dev/null || true
          done

          # Extract iPad screenshots
          if [ -d ".build/screenshots_iPad.xcresult/Attachments" ]; then
            cp .build/screenshots_iPad.xcresult/Attachments/*.png .build/screenshots/iPad/ 2>/dev/null || true
          fi
          find .build -path "*DerivedData_iPad*" -name "Attachments" -type d 2>/dev/null | while read dir; do
            cp "$dir"/*.png .build/screenshots/iPad/ 2>/dev/null || true
          done

          echo "=== iPhone Screenshots ==="
          ls -la .build/screenshots/iPhone/ 2>/dev/null || echo "No iPhone screenshots"
          echo ""
          echo "=== iPad Screenshots ==="
          ls -la .build/screenshots/iPad/ 2>/dev/null || echo "No iPad screenshots"

      - name: Upload iPhone Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-iPhone
          path: .build/screenshots/iPhone/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload iPad Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-iPad
          path: .build/screenshots/iPad/*.png
          if-no-files-found: warn
          retention-days: 30