# ═══════════════════════════════════════════════════════════════
# Build & Test — push/PR 到 main 时编译并运行单元测试和 UI 测试
# ═══════════════════════════════════════════════════════════════

name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Build & Test
        run: |
          mkdir -p .build
          set +e
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build test 2>&1 | tee .build/build.log
          RESULT=${PIPESTATUS[0]}
          echo "Exit code: $RESULT"

          if [ $RESULT -ne 0 ]; then
            echo "Build or test failed"
            exit 1
          fi
          echo "Build and test succeeded"

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/DerivedData
          if-no-files-found: error

  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: "iPhone"
          - type: "iPad"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Boot Simulator
        run: |
          echo "Available ${{ matrix.type }} devices:"
          xcrun simctl list devices available | grep "${{ matrix.type}}" | head -10
          DEVICE_NAME=""
          # Find latest ${{ matrix.type }} device (iPhone or iPad)
          DEVICE_NAME=$(xcrun simctl list devices available | grep "${{ matrix.type}}" | grep Shutdown | head -1 | sed 's/.*(//' | sed 's/).*//')
          if [ -z "$DEVICE_NAME" ]; then
            echo "ERROR: No available ${{ matrix.type }} device"
            exit 1
          fi
          echo "Using: $DEVICE_NAME"
          DEVICE_ID=$(xcrun simctl list devices available | grep "$DEVICE_NAME" | grep Shutdown | awk -F'(' '{print $2}' | awk -F')' '{print $1}' | head -1)
          echo "Booting device ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Run Guided Tour Test for Screenshots
        run: |
          mkdir -p .build
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ env.DEVICE_NAME }}" \
            -derivedDataPath .build/DerivedData \
            test \
            -only-testing:UstiaGoUITests/GuidedTourTests \
            -resultBundlePath .build/screenshots.xcresult 2>&1 | tee .build/screenshots.log
          echo "Test completed"

      - name: Extract Screenshots from Test Results
        run: |
          mkdir -p .build/screenshots/${{ matrix.type }}
          chmod +x .build/DerivedData/Logs/Test/*.xcresult 2>/dev/null || true

          # Extract screenshots from xcresult bundle
          if [ -d ".build/DerivedData/Logs/Test" ]; then
            find .build/DerivedData/Logs/Test -name "*.xcresult" -type d | while read result; do
              ATTACHMENTS_DIR="$result/Attachments"
              if [ -d "$ATTACHMENTS_DIR" ]; then
                cp "$ATTACHMENTS_DIR"/*.png ".build/screenshots/${{ matrix.type }}/" 2>/dev/null || true
              fi
            done
          fi

          if [ -d ".build/screenshots.xcresult/Attachments" ]; then
            cp .build/screenshots.xcresult/Attachments/*.png ".build/screenshots/${{ matrix.type }}/" 2>/dev/null || true
          fi

          echo "=== Screenshots found ==="
          find .build -name "*.png" -type f 2>/dev/null
          ls -la .build/screenshots/${{ matrix.type }}/ 2>/dev/null || echo "No screenshots found"

      - name: Upload Screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ matrix.type }}
          path: .build/screenshots/${{ matrix.type }}/*.png
          if-no-files-found: warn
          retention-days: 30