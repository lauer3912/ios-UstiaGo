# ═══════════════════════════════════════════════════════════════
# Build & Test — push/PR 到 main 时编译并运行单元测试和 UI 测试
# ═══════════════════════════════════════════════════════════════

name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: Build & Test
        run: |
          xcrun xcodebuild \
            -project ios/UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee .build/build.log

          xcrun xcodebuild \
            test-without-building \
            -derivedDataPath .build/DerivedData \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            2>&1 | tee -a .build/build.log

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/DerivedData
          if-no-files-found: error