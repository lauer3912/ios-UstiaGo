# ═══════════════════════════════════════════════════════════════
# Build & Test — push/PR 到 main 时编译并运行单元测试和 UI 测试
# ═══════════════════════════════════════════════════════════════

name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCHEME: UstiaGo
  PROJECT_PATH: ios/UstiaGo.xcodeproj
  XCODE_APP: /Applications/Xcode_16.2.app

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Xcode ──────────────────────────────────────────────
      - name: Select Xcode & Show Versions
        run: |
          if [ -d "${{ env.XCODE_APP }}" ]; then
            sudo xcode-select -s "${{ env.XCODE_APP }}/Contents/Developer"
          else
            echo "Warning: ${{ env.XCODE_APP }} not found; using system default"
          fi
          xcodebuild -version
          swift --version

      # ── Cache DerivedData ──────────────────────────────────
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('ios/**') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      # ── Build & Test ─────────────────────────────────────────
      - name: Build & Test
        run: |
          xcodebuild test \
            -project "${{ env.PROJECT_PATH }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # ── Attach Test Results ────────────────────────────────
      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 7
