name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Build
        run: |
          cd ios
          xcodebuild build \
            -project UstiaGo.xcodeproj \
            -scheme UstiaGo \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          cd ios
          xcodebuild test \
            -project UstiaGo.xcodeproj \
            -scheme UstiaGoTests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI Tests
        run: |
          cd ios
          xcodebuild test \
            -project UstiaGo.xcodeproj \
            -scheme UstiaGoUITests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO