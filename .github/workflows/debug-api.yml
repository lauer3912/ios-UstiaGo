name: Debug API Key

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-14
    env:
      APPSTORE_API_KEY_CONTENT: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install JWT
        run: gem install jwt --no-document

      - name: Debug secret
        run: |
          echo "=== Secret Debug ==="
          echo "Key content length: ${#APPSTORE_API_KEY_CONTENT}"
          echo "First 100 chars: ${APPSTORE_API_KEY_CONTENT:0:100}"
          echo "Last 50 chars: ${APPSTORE_API_KEY_CONTENT: -50}"
          echo "Contains BEGIN: $(echo $APPSTORE_API_KEY_CONTENT | grep -c 'BEGIN PRIVATE KEY')"
          echo "Contains END: $(echo $APPSTORE_API_KEY_CONTENT | grep -c 'END PRIVATE KEY')"
          
      - name: Test JWT creation
        run: |
          ruby << 'RUBY'
require 'jwt'

key_id = 'H3973L93M5'
issuer_id = 'b2a00f88-3a8d-40d0-b148-1f1db92e10b7'
key_content = ENV['APPSTORE_API_KEY_CONTENT'] || ''

puts "Key length: #{key_content.length}"

payload = {
  iss: issuer_id,
  exp: Time.now.to_i + 600,
  aud: 'appstoreconnect-v1'
}

begin
  token = JWT.encode(payload, key_content, 'RS256')
  puts "JWT created successfully"
  puts "Token: #{token[0..80]}..."
  
  # Test API call
  require 'net/http'
  uri = URI('https://api.appstoreconnect.apple.com/v1/apps')
  req = Net::HTTP::Get.new(uri)
  req['Authorization'] = "Bearer #{token}"
  req['Content-Type'] = 'application/json'
  
  http = Net::HTTP.new(uri.host, uri.port)
  http.use_ssl = true
  response = http.request(req)
  
  puts "API Response: #{response.code}"
  if response.body
    begin
      json = JSON.parse(response.body)
      puts "Response: #{json.inspect[0..200]}"
    rescue
      puts "Raw response: #{response.body[0..200]}"
    end
  end
rescue => e
  puts "Error: #{e.class}: #{e.message}"
  puts e.backtrace.first(3).join("\n")
end
RUBY
