# ═══════════════════════════════════════════════════════════════
# Debug API Key — 验证 App Store Connect API 密钥是否正确
# ═══════════════════════════════════════════════════════════════

name: Debug API Key

on:
  workflow_dispatch:

env:
  APPSTORE_API_KEY_CONTENT: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
  APPSTORE_KEY_ID: H3973L93M5
  APPSTORE_ISSUER_ID: b2a00f88-3a8d-40d0-b148-1f1db92e10b7
  BUNDLE_ID: com.ggsheng.UstiaGo
  TEAM_ID: 9L6N2ZF26B

jobs:
  debug:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Dependencies
        run: gem install jwt openssl --no-document

      - name: Debug Secret (safe display)
        run: |
          echo "=== Secret Debug ==="
          echo "Key content length: ${#APPSTORE_API_KEY_CONTENT}"
          echo "Contains 'BEGIN': $(echo "$APPSTORE_API_KEY_CONTENT" | grep -c 'BEGIN PRIVATE KEY')"
          echo "Contains 'END':   $(echo "$APPSTORE_API_KEY_CONTENT" | grep -c 'END PRIVATE KEY')"
          echo "Has newlines:     $(echo "$APPSTORE_API_KEY_CONTENT" | tr -d '\n\r' | wc -c)"

      - name: Generate JWT & Call App Store Connect API
        run: |
          ruby << 'RUBY'
require 'jwt'
require 'net/http'
require 'json'
require 'openssl'

key_id     = ENV['APPSTORE_KEY_ID']
issuer_id  = ENV['APPSTORE_ISSUER_ID']
key_content = ENV['APPSTORE_API_KEY_CONTENT'] || ''
bundle_id  = ENV['BUNDLE_ID'] || 'com.ggsheng.UstiaGo'

if key_id.nil? || key_id.empty? || issuer_id.nil? || issuer_id.empty?
  puts "! Fatal: APPSTORE_KEY_ID or APPSTORE_ISSUER_ID not set"
  exit 1
end

puts "=== Key Info ==="
puts "Length: #{key_content.length}"
puts ""

# ── 解析 EC 私钥（PKCS#8 格式）──
begin
  ec_key = OpenSSL::PKey::EC.new(key_content)
  puts "Key algorithm: #{ec_key.group.curve_name}"
rescue => e
  puts "! Fatal: Cannot parse EC private key: #{e.message}"
  exit 1
end

# ── 生成 ES256 JWT ──
payload = {
  iss: issuer_id,
  exp: Time.now.to_i + 600,
  aud: 'appstoreconnect-v1'
}

begin
  token = JWT.encode(payload, ec_key, 'ES256')
  puts "JWT generated successfully (#{token.length} chars)"
  puts "Prefix: #{token[0..60]}..."
rescue => e
  puts "! Fatal: JWT encoding failed: #{e.message}"
  exit 1
end

# ── 调用 App Store Connect API ──
uri = URI("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=#{bundle_id}")
headers = {
  'Authorization' => "Bearer #{token}",
  'Content-Type'  => 'application/json'
}

puts ""
puts "=== API Call ==="
puts "GET #{uri}"

http = Net::HTTP.new(uri.host, uri.port)
http.use_ssl = true
http.read_timeout = 30

begin
  request = Net::HTTP::Get.new(uri, headers)
  response = http.request(request)
  puts "HTTP #{response.code}"

  if response.code.to_i == 200
    data = JSON.parse(response.body)
    apps = data['data'] || []
    if apps.any?
      app = apps.first
      puts "✓ App found: #{app['id']} — #{app.dig('attributes', 'name')}"
    else
      puts "! No app found for bundle ID '#{bundle_id}'"
    end
  else
    puts "✗ API error:"
    puts JSON.pretty_generate(JSON.parse(response.body)) rescue response.body[0..500]
  end
rescue => e
  puts "! Network error: #{e.class}: #{e.message}"
end
RUBY
