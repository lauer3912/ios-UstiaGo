# ═══════════════════════════════════════════════════════════════
# Debug API Key — 验证 App Store Connect API 密钥是否正确
# ═══════════════════════════════════════════════════════════════
#
# 需要在 GitHub Repo Settings > Variables 设置:
#   APPSTORE_ISSUER_ID    - App Store Connect Issuer ID
#   APPSTORE_API_KEY_ID   - App Store Connect API Key ID
# ═══════════════════════════════════════════════════════════════

name: Debug API Key

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      APPSTORE_API_KEY_CONTENT: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APPSTORE_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Dependencies
        run: gem install jwt openssl --no-document

      - name: Debug Secret (safe display)
        run: |
          echo "=== Secret Debug ==="
          echo "Key content length: ${#APPSTORE_API_KEY_CONTENT}"
          echo "Contains 'BEGIN': $(echo "$APPSTORE_API_KEY_CONTENT" | grep -c 'BEGIN PRIVATE KEY')"
          echo "Contains 'END':   $(echo "$APPSTORE_API_KEY_CONTENT" | grep -c 'END PRIVATE KEY')"
          echo "Has newlines:     $(echo "$APPSTORE_API_KEY_CONTENT" | tr -d '\n\r' | wc -c)"

      - name: Generate JWT & Call App Store Connect API
        run: ruby scripts/debug_api.rb